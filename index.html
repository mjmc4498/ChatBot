<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot de Gobernanza de Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header text-center">
                <h1>Chatbot de Gobernanza de Datos</h1>
            </div>
            <div class="card-body" id="chat-window">
                <!-- Los mensajes del chat se agregarán aquí -->
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <input type="text" class="form-control" id="user-input" placeholder="Escribe un mensaje...">
                    <button class="btn btn-primary" id="send-btn">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({startOnLoad:true});</script>
    <script src="public/script.js"></script>
</body>
</html>
